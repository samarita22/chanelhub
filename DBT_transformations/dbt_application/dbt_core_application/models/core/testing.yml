version: 2

models:
 - name: dim_customers
   columns:
    - name: client_id
      tests:
       - unique
       - not_null
    - name: pays
      tests:
       - unique
       
 - name: stg_orders
   columns:
    - name: order_id
      tests:
       - unique
       - not_null
    - name: status
      tests:
        - accepted_values:
           values: ['completed', 'shipped', 'cancelled', 'pending']